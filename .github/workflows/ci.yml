name: CI

# 此前仓库里 9 个 test 脚本与 build 没有任何 CI 在执行，PR 处于零门禁状态。
# 本 workflow 把它们接上：构建 + i18n 校验 + 全部单元/兼容性测试。

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Validate i18n resources
        run: npm run i18n:validate

      - name: Run unit and compatibility tests
        run: |
          npm run test:config-compatibility
          npm run test:vault-compatibility
          npm run test:web-crypto
          npm run test:notifications-security
          npm run test:webauthn-connectors
