# =============================================================================
# Sync Upstream for EndDream/nodewarden
# 上游: https://github.com/shuaiplus/nodewarden
#
# 设计原则（A 方案）:
#   1. 只读上游：upstream 仅用于 fetch，永不向它推送。
#   2. 机器人不写 main：main 受分支保护，同步结果只能以 PR 形式进入。
#   3. 门禁前置：GITHUB_TOKEN 创建的 PR 不会触发新的 workflow（GitHub 防递归），
#      所以 ci-gate 在开 PR 之前就在合并后的工作树上跑，失败则根本不开 PR。
#   4. 冲突不猜测：merge 失败立即 abort，开 issue 留证，不做任何"自动取一边"。
#   5. 双模式：有 SYNC_PAT 时全量同步（含 .github/workflows/）；没有时退化为
#      "工作流目录还原为 fork 版本 + 开 issue 告知"，不会静默丢东西。
#
# 两种模式:
#   mode=pat          checkout / push / gh 全部用 secrets.SYNC_PAT
#                     → 上游工作流改动可自动同步；bot PR 也会自动触发 CI
#   mode=github-token 只用内置 GITHUB_TOKEN
#                     → 内置 token 永远没有 workflows 权限，工作流目录必须
#                       还原为 fork 版本，上游改动写进 PR 正文 / issue
#
# 升级到 pat 模式（一次性，约 2 分钟，无需改代码）:
#   1. 建 fine-grained PAT：Contents RW + Workflows RW + Pull requests RW
#      + Issues RW，仅限 EndDream/nodewarden
#   2. Settings → Secrets and variables → Actions → New repository secret
#      名称 SYNC_PAT
#   3. 手动跑一次本 workflow 验证
#   之后再考虑把 "Build & Test" 设为 main 的必需检查（pat 模式 bot PR 会触发 CI；
#   github-token 模式下 bot PR 不触发 CI，设了会导致 PR 永远等不到检查）。
# =============================================================================

name: Sync Upstream

on:
  schedule:
    - cron: '17 3 * * *'      # 每天 UTC 03:17
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/shuaiplus/nodewarden.git

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 推送 sync/* 临时分支
      pull-requests: write   # 创建同步 PR
      issues: write          # 冲突或仅工作流变更时留证

    steps:
      - name: Detect sync token
        id: token
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          # 只判断是否存在，绝不回显值
          if [ -n "$SYNC_PAT" ]; then
            echo "mode=pat" >> "$GITHUB_OUTPUT"
            echo "使用 SYNC_PAT：工作流文件随上游一起同步。"
          else
            echo "mode=github-token" >> "$GITHUB_OUTPUT"
            echo "未配置 SYNC_PAT：仅同步非工作流改动（见 UPSTREAM-SYNC.md 第 4 节）。"
          fi

      - name: Checkout main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: main
          fetch-depth: 0
          # 没有 SYNC_PAT 时回落到内置 token，行为与旧版一致
          token: ${{ secrets.SYNC_PAT || github.token }}

      - name: Configure git and fetch upstream
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream --tags

      - name: Check for updates
        id: check
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "上游没有新提交，本次跳过。"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "branch=sync/upstream-$(date -u +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect upstream changes
        if: steps.check.outputs.needed == 'true'
        run: |
          git log --oneline --no-decorate origin/main..upstream/main > /tmp/commits.txt
          git diff --name-only origin/main upstream/main -- .github/workflows > /tmp/wf-changed.txt || true
          echo "上游提交 $(wc -l < /tmp/commits.txt) 条，工作流改动 $(wc -l < /tmp/wf-changed.txt) 个文件。"

      - name: Update mirror branch
        if: steps.check.outputs.needed == 'true'
        run: |
          # mirror/upstream 是上游 main 的精确副本，只允许本 job 写。
          # 上游若改写历史，这里用 --force 让镜像仍然一致。
          git push --force origin "upstream/main:refs/heads/mirror/upstream"

      - name: Merge upstream without committing
        id: merge
        if: steps.check.outputs.needed == 'true'
        run: |
          if git merge --no-commit --no-ff upstream/main; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > /tmp/conflicts.txt || true
            git merge --abort || true
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report merge conflict
        if: steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "自动同步在合并 \`upstream/main\` 时发生冲突（$(date -u +%F)），已中止，**未推送任何分支**。"
            echo
            echo "冲突文件："
            echo '```'
            cat /tmp/conflicts.txt
            echo '```'
            echo
            echo "本地处理："
            echo '```bash'
            echo 'git fetch upstream'
            echo "git checkout -b ${{ steps.check.outputs.branch }} origin/main"
            echo 'git merge --no-ff upstream/main'
            echo '```'
            echo
            echo "解决后推分支、开 PR，并确认 \`scripts/ci-gate.sh\` 全绿。"
          } > /tmp/issue-body.md
          existing=$(gh issue list --state open --search '"[sync] 上游合并冲突" in:title' --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/issue-body.md
          else
            gh issue create --title "[sync] 上游合并冲突" --body-file /tmp/issue-body.md
          fi
          exit 1

      - name: Keep fork workflow files
        # 只有 github-token 模式才需要：内置 token 无权新增/修改工作流文件，
        # 推送会被 "refusing to allow a GitHub App to create or update workflow" 拒。
        if: steps.merge.outputs.conflict == 'false' && steps.token.outputs.mode == 'github-token'
        run: |
          git rm -r -q --cached .github/workflows
          git checkout origin/main -- .github/workflows

      - name: Check effective diff
        id: diff
        if: steps.merge.outputs.conflict == 'false' && steps.token.outputs.mode == 'github-token'
        run: |
          if git diff --quiet HEAD; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
            echo "合并结果与 main 无差异（上游改动全部落在工作流目录）。"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report workflow-only update
        if: steps.token.outputs.mode == 'github-token' && steps.diff.outputs.empty == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git merge --abort || true
          if [ -s /tmp/wf-changed.txt ]; then
            {
              echo "上游本次只改动了工作流文件（$(date -u +%F)），这些改动**没有**进入 fork，已跳过本次同步。"
              echo
              echo '```'
              cat /tmp/wf-changed.txt
              echo '```'
              echo
              echo "两条路可选："
              echo '1. 配置 SYNC_PAT（见 UPSTREAM-SYNC.md 第 4 节），此后自动同步；'
              echo '2. 人工搬运这批改动，再手动重跑本 workflow，即可把上游标记为已同步。'
            } > /tmp/issue-body.md
            existing=$(gh issue list --state open --search '"[sync] 上游工作流更新待搬运" in:title' --json number --jq '.[0].number // empty')
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body-file /tmp/issue-body.md
            else
              gh issue create --title "[sync] 上游工作流更新待搬运" --body-file /tmp/issue-body.md
            fi
          fi

      - name: Commit merge
        if: steps.merge.outputs.conflict == 'false' && steps.diff.outputs.empty != 'true'
        run: |
          git commit --no-edit
          git log --oneline -1

      - name: Setup Node.js
        if: steps.merge.outputs.conflict == 'false' && steps.diff.outputs.empty != 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          cache: npm

      - name: Run gate
        if: steps.merge.outputs.conflict == 'false' && steps.diff.outputs.empty != 'true'
        run: bash scripts/ci-gate.sh

      - name: Push sync branch
        if: steps.merge.outputs.conflict == 'false' && steps.diff.outputs.empty != 'true'
        run: |
          BRANCH="${{ steps.check.outputs.branch }}"
          git checkout -B "$BRANCH"
          git fetch origin "$BRANCH" || true
          git push --force-with-lease origin "HEAD:refs/heads/$BRANCH"

      - name: Open pull request
        if: steps.merge.outputs.conflict == 'false' && steps.diff.outputs.empty != 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
          MODE: ${{ steps.token.outputs.mode }}
        run: |
          BRANCH="${{ steps.check.outputs.branch }}"
          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "PR #$existing 已存在，本次只更新了分支内容。"
            exit 0
          fi
          {
            echo "上游 \`main\` 的自动同步，门禁已在本 job 内通过。"
            echo
            echo "### 上游提交"
            echo '```'
            cat /tmp/commits.txt
            echo '```'
            if [ "$MODE" = "github-token" ] && [ -s /tmp/wf-changed.txt ]; then
              echo
              echo "### 注意：未同步的工作流改动"
              echo '```'
              cat /tmp/wf-changed.txt
              echo '```'
              echo "以上文件的上游改动已被 fork 版本覆盖（未配置 \`SYNC_PAT\`，内置 token 无 workflows 权限），需人工评估。"
            fi
            echo
            echo "### 说明"
            echo "- 令牌模式：\`$MODE\`"
            echo "- 门禁：\`bash scripts/ci-gate.sh\`，在本 job 内执行"
            if [ "$MODE" = "github-token" ]; then
              echo "- 本 PR 由内置 \`GITHUB_TOKEN\` 创建，不会再次触发 CI（GitHub 防递归），结果以本 job 日志为准"
            else
              echo "- 本 PR 由 \`SYNC_PAT\` 创建，会自动触发 CI，可与 job 日志互相印证"
            fi
            echo "- 冲突由人工解决，不做自动取舍"
          } > /tmp/pr-body.md
          gh pr create --base main --head "$BRANCH" \
            --title "chore(sync): 上游更新 $(date -u +%F)" \
            --body-file /tmp/pr-body.md
